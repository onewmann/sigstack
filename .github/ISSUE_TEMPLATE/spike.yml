name: Spike
description: Time-boxed investigation that answers one question
title: "[spike] "
labels: ["type:spike"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: The one question this spike answers.
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Time box
      placeholder: 3 h
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Expected output
      description: e.g. a decision note, a prototype branch, a benchmark table.
    validations:
      required: true
