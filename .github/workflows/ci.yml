name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every commit on main keeps its own run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          cache: true
          # Only builds on main write the cache, so pull requests cannot pollute it.
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Lint
        run: pixi run lint

      - name: Type check
        run: pixi run typecheck

      - name: Test
        run: pixi run test --junitxml=junit.xml

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.os }}
          path: junit.xml
          if-no-files-found: ignore
