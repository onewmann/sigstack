[workspace]
name = "sigstack"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[dependencies]
python = "3.12.*"
numpy = ">=2.5.4,<3"
scipy = ">=1.18.1,<2"
pytest = ">=9.2.0,<10"
hypothesis = ">=6.170.15,<7"
ruff = ">=0.17.4,<0.18"
mypy = ">=2.4.1,<3"
pre-commit = ">=4.7.0,<5"

[pypi-dependencies]
sigstack = { path = ".", editable = true }

[tasks]
test = { cmd = "pytest", description = "Run the test suite" }
lint = { cmd = "ruff check && ruff format --check", description = "Lint and format check" }
fmt = { cmd = "ruff check --fix --exit-zero && ruff format", description = "Auto-fix, then format" }
typecheck = { cmd = "mypy", description = "Static type check (mypy strict)" }
plan = { cmd = "python scripts/plan.py", description = "Validate backlog, regenerate docs/plan/PLAN.md and BACKLOG.md" }
plan-check = { cmd = "python scripts/plan.py --check", description = "Validate backlog and schedule only" }
check = { depends-on = ["lint", "typecheck", "test", "plan-check"], description = "lint + typecheck + test + plan-check" }
