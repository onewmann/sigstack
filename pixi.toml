[workspace]
name = "sigstack"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[dependencies]
python = "3.12.*"
numpy = ">=2.5.4,<3"
scipy = ">=1.18.1,<2"
pytest = ">=9.2.0,<10"
hypothesis = ">=6.170.15,<7"
ruff = ">=0.17.4,<0.18"
mypy = ">=2.4.1,<3"
pre-commit = ">=4.7.0,<5"

[pypi-dependencies]
sigstack = { path = ".", editable = true }

[tasks]
test = { cmd = "pytest", description = "Run the test suite" }
# lint, fmt and typecheck are placeholders until task T3 wires them to ruff and mypy.
lint = { cmd = "echo 'lint: not configured yet (T3)'", description = "Lint and format check" }
fmt = { cmd = "echo 'fmt: not configured yet (T3)'", description = "Format and auto-fix" }
typecheck = { cmd = "echo 'typecheck: not configured yet (T3)'", description = "Static type check" }
check = { depends-on = ["lint", "typecheck", "test"], description = "lint + typecheck + test" }
