# sigstack planning settings: calendar, velocity, actuals, release profiles.
# Read by scripts/plan.py together with backlog.toml.

[settings]
start = "2026-10-26"          # Monday of Sprint 1 (moved from 09.11.2026, D-020)
sprint_days = 14
default_velocity = 8          # points per full sprint until actuals exist
planned_velocity = 8          # baseline for the "velocity off plan" trigger; /replan resets it
velocity_window = 3           # mean of the last N sprints once actuals exist
profile = "default"           # active profile, see [profiles.*]
horizon_slots = 80            # how many two-week slots the scheduler may use
pull_ahead = 1                # how many later releases may fill leftover capacity

# Capacity factor per two-week slot, chosen by the slot's start date.
# 1.0 = normal lecture period, 0 = pause, 1.5 = lecture-free time.
# Uni Freiburg: WS 2026/27 lectures 19.10.2026-13.02.2027, Christmas break 24.12.-06.01.,
# SS 2027 lectures 19.04.-24.07.2027. Exam windows are ASSUMPTIONS: check the ESE exam plan.
[[period]]
from = "2026-12-21"
to = "2027-01-03"
factor = 0.0
label = "Christmas break"

[[period]]
from = "2027-02-01"
to = "2027-02-14"
factor = 0.5
label = "Last lecture weeks, exam preparation"

[[period]]
from = "2027-02-15"
to = "2027-03-14"
factor = 0.0
label = "Exam period (assumed)"

[[period]]
from = "2027-03-15"
to = "2027-04-11"
factor = 1.5
label = "Lecture-free"

[[period]]
from = "2027-07-12"
to = "2027-07-25"
factor = 0.5
label = "Last lecture weeks, exam preparation"

[[period]]
from = "2027-07-26"
to = "2027-08-22"
factor = 0.0
label = "Exam period (assumed)"

[[period]]
from = "2027-08-23"
to = "2027-10-17"
factor = 1.5
label = "Lecture-free"

[[period]]
from = "2027-12-20"
to = "2028-01-02"
factor = 0.0
label = "Christmas break (assumed)"

[[period]]
from = "2028-01-31"
to = "2028-02-13"
factor = 0.5
label = "Last lecture weeks (assumed)"

[[period]]
from = "2028-02-14"
to = "2028-03-12"
factor = 0.0
label = "Exam period (assumed)"

[[period]]
from = "2028-03-13"
to = "2028-04-16"
factor = 1.5
label = "Lecture-free (assumed)"

# Measured velocity, one entry per finished sprint (added by /sprint-review).
# [[actual]]
# sprint = 1
# done_points = 8
# note = ""

[[actual]]
sprint = 1
done_points = 8
note = "All five stories done on 06.-07.11.2026, before the planned start; Oli spent 4-8 h. Calendar moved two weeks earlier (D-020)."

# ------------------------------------------------------------------ profiles
# A profile maps groups (backlog.toml) to releases, in order. Keep a release at or below
# about three sprints of points; plan.py warns above that.
# "default":  breadth first, general modules, then radar/RF (order of ROADMAP section 5).
# "showcase": FMCW radar showcase first (simulate -> verify -> optimise -> embedded),
#             breadth afterwards. Same stories, different order.

[profiles.default]
description = "Breadth first: general modules, then radar/RF"

