# sigstack product backlog — single source of truth for stories.
#
# Edit this file, then run `python scripts/plan.py` (or `pixi run plan`) to validate it and
# regenerate docs/plan/PLAN.md and docs/plan/BACKLOG.md. Never edit the generated files.
#
# Story fields
#   id       "S<epic>.<n>", unique, never reused
#   epic     "E<n>", must exist in [[epic]]
#   group    work package; profiles in plan.toml map groups to releases
#   title    short name
#   story    user story ("As a ... I want ... so that ...")
#   ac       acceptance criteria, one per entry
#   points   1, 2, 3, 5 (8 means: split before it enters a sprint)
#   deps     story ids that must be done first (same or earlier sprint)
#   status   "todo" | "committed" (in a planned sprint) | "done" | "dropped"
#   sprint   sprint number, required for committed and done
# Order inside a group is the priority order.

