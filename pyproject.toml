[build-system]
# hatchling is temporary; story S0.3 replaces it with scikit-build-core for the C++ part.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sigstack"
version = "0.0.1"
description = "Signal processing toolkit: block-based DSP, C++ core, Monte Carlo design loop"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "scipy",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/onewmann/sigstack"

[dependency-groups]
# PyWavelets is a test reference only (S8.1), like SciPy.
test = ["pytest", "hypothesis", "pywavelets"]

[tool.hatch.build.targets.wheel]
packages = ["python/sigstack"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["python", "tests"]
# The planning scripts are imported unchanged from the kickoff kit while the plan settles.
extend-exclude = ["scripts"]

[tool.ruff.format]
# ruff also formats Python blocks in Markdown. The planning documents hold illustrative
# snippets and are mirrored in the owner's notes, so they stay as written.
exclude = ["docs/ROADMAP.md", "docs/KICKOFF.md", "docs/sprints/**", "docs/plan/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "NPY", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["sigstack"]

[tool.mypy]
python_version = "3.11"
files = ["python/sigstack", "tests"]
mypy_path = "python"
strict = true
warn_unreachable = true

# SciPy ships no type stubs; it is only used as a test reference.
[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

# PyWavelets ships no type hints; it is only used as a test reference (S8.1).
[[tool.mypy.overrides]]
module = ["pywt", "pywt.*"]
ignore_missing_imports = true

# Tests may leave helpers and fixtures unannotated.
[[tool.mypy.overrides]]
module = ["tests", "tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
